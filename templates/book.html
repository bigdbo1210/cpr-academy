{% extends "base.html" %}
{% block content %}
<p><a href="{{ url_for('my_courses') }}">&larr; My Courses</a></p>
<div class="card" style="max-width:560px;">
    <h2 style="margin-top:0;">Book Your Hands-On Skills Session</h2>
    <p style="color:#5a6a7d; line-height:1.6;"><strong>{{ course.name }}</strong> — 240 Whittington Parkway, Louisville, KY 40222. Sessions run 20–30 minutes. Bring a photo ID and your completion certificate code: <strong>{{ e.cert_code }}</strong>.</p>
    <form method="POST">
        <label>Choose a day</label>
        <select name="date" required>
            {% for d in days %}
            <option value="{{ d.value }}">{{ d.label }}</option>
            {% endfor %}
        </select>
        <label>Choose a block</label>
        <select name="block" required>
            {% for b in blocks %}
            <option value="{{ b }}">{{ b }}</option>
            {% endfor %}
        </select>
        <button class="btn" type="submit" style="margin-top:16px;">Book My Session</button>
    </form>
</div>
{% endblock %}
